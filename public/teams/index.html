<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DISSK</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button {
        min-height: 56px;
        padding: 14px 26px;
        border: 0;
        border-radius: 12px;
        background: #03424f;
        color: #fff;
        font: inherit;
        font-size: 17px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(3, 66, 79, 0.22);
      }
    </style>
  </head>
  <body>
    <button id="open-dissk" type="button">Åbn din personlige DISSK</button>

    <script src="https://res.cdn.office.net/teams-js/2.55.0/js/MicrosoftTeams.min.js"></script>
    <script>
      const disskUrl = "https://dissk.kansbergconsulting.dk";
      let teamsReady = false;

      if (window.microsoftTeams && window.microsoftTeams.app) {
        window.microsoftTeams.app.initialize()
          .then(() => { teamsReady = true; })
          .catch(() => { teamsReady = false; });
      }

      document.getElementById("open-dissk").addEventListener("click", () => {
        if (teamsReady && window.microsoftTeams.app.isInitialized()) {
          window.microsoftTeams.app.openLink(disskUrl).catch(() => {
            window.open(disskUrl, "_blank", "noopener,noreferrer");
          });
          return;
        }
        window.open(disskUrl, "_blank", "noopener,noreferrer");
      });
    </script>
  </body>
</html>
